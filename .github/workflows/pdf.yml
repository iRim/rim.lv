name: Build and Deploy

on:
  push:
    branches: [master]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not start"
          exit 1

      - name: Prerender home page
        run: node prerender.js

      - name: Update sitemap lastmod
        run: node update-sitemap.js

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Verify generated build
        run: node verify-build.js

      - name: Remove internal PDF entry
        run: rm public/pdf.html

      - name: Verify internal PDF entry is not published
        run: test ! -e public/pdf.html

      - name: Publish site and PDF
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: rim.lv
